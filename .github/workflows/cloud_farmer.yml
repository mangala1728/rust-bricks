name: Cloud Free-Tier Auto Brick Farmer

# 失敗嘗試樹（git-handoff 相容的 attempt/ 分支）、二振出局、壓力紅燈、日誌保鮮：
# 機制說明見 docs/CLOUD-FARMER-ATTEMPT-TREE.md
on:
  schedule:
    # 每 3 小時巡航一次（UTC 0, 3, 6, …）；GitHub 排程可能延遲或略過，推新規格會立即觸發
    - cron: '0 */3 * * *'
  push:
    branches: [ main ]
    paths: [ 'specs/**' ]
  workflow_dispatch:
    inputs:
      spec_path:
        description: "規格書路徑 (留空則自動從 specs/ 佇列取下一塊待做規格)"
        required: false
        default: ""
      module_name:
        description: "產出模組名稱 (與 spec_path 一起指定)"
        required: false
        default: ""
      push_to_branch:
        description: "驗證通過後是否自動推送至遠端分支"
        required: false
        default: "true"

# 同一時間只跑一輪，避免兩輪搶同一份規格
concurrency:
  group: cloud-farmer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read
  models: read

jobs:
  cloud_farm_brick:
    name: Farm & Guard Pure Rust Brick
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure Git Identity for Cloud Farmer
        run: |
          git config user.name "rust-bricks-cloud-farmer[bot]"
          git config user.email "cloud-farmer@users.noreply.github.com"

      - name: Build Farmer
        run: cargo build -q

      - name: 日誌保鮮：清除已入庫模組的過期死路分支
        run: cargo run -q -- farm-prune --push

      - name: 壓力紅燈檢查
        id: pressure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/farmer_pressure.sh

      - name: 選定規格（佇列狀態由失敗嘗試樹推導）
        id: queue
        if: steps.pressure.outputs.frozen != 'true'
        env:
          INPUT_SPEC: ${{ inputs.spec_path }}
          INPUT_MOD: ${{ inputs.module_name }}
        run: |
          cargo run -q -- farm-status >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$INPUT_SPEC" ] && [ -n "$INPUT_MOD" ]; then
            echo "🎯 [cloud-farmer] 手動指定：$INPUT_SPEC -> $INPUT_MOD"
            { echo "next_spec=$INPUT_SPEC"; echo "next_module=$INPUT_MOD"; } >> "$GITHUB_OUTPUT"
          else
            cargo run -q -- farm-queue
          fi

      - name: 農作（二振出局、死路帶入提示、失敗記入 attempt/ 分支）
        id: farm
        if: steps.pressure.outputs.frozen != 'true' && steps.queue.outputs.next_module != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC: ${{ steps.queue.outputs.next_spec }}
          MOD: ${{ steps.queue.outputs.next_module }}
          PUSH_TO_BRANCH: ${{ inputs.push_to_branch }}
        run: |
          echo "🌾 [cloud-farmer] 選定目標規格: $SPEC -> 模組: $MOD"
          if [ "$PUSH_TO_BRANCH" = "false" ]; then
            cargo run -q -- farm "$SPEC" "$MOD"
          else
            cargo run -q -- farm "$SPEC" "$MOD" --push
          fi

      - name: 依 git 狀態同步 issue（卡關／規格可疑／佇列空）
        if: always() && steps.pressure.outputs.frozen != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/farmer_issues.sh

      - name: 本輪摘要
        if: always()
        env:
          FROZEN: ${{ steps.pressure.outputs.frozen }}
          MOD: ${{ steps.queue.outputs.next_module }}
          OUTCOME: ${{ steps.farm.outputs.outcome }}
          BRANCH: ${{ steps.farm.outputs.attempt_branch }}
        run: |
          {
            echo "## 本輪結果"
            echo "- 壓力紅燈凍結：${FROZEN:-false}"
            echo "- 模組：${MOD:-（佇列無可做規格）}"
            echo "- 結果：${OUTCOME:-（未執行）}"
            if [ -n "$BRANCH" ]; then echo "- 失敗嘗試分支：\`$BRANCH\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
