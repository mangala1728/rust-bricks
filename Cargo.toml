[package]
name = "rust-bricks"
version = "0.1.0"
edition = "2021"
default-run = "rust-bricks"
authors = ["Mangala Hsu <m@example.tw>"]
description = "Zero-dependency, 09-contract-compliant Rust function building blocks for high-performance cross-platform AI agent workflows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mangala1728/rust-bricks"

[profile.dev]
# 只保留「檔名 + 行號」堆疊追蹤，省略龐大變數型別 DWARF 符號表，兼顧三分鐘定位與硬碟瘦身
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
# 關閉 100+ 支獨立整合測試執行檔的 incremental session 堆積，防止 target/ 膨脹至數十 GB
incremental = false

[dependencies]
# 剛性約束：100% 零外部第三方依賴（Zero 3rd-party dependencies）
